version: "3.9"

services:
  # ── CDSI API Server ──
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ZMQ_PUB_ADDRESS=tcp://*:5555
      - ZMQ_SUB_ADDRESS=tcp://api:5555
      - LOG_LEVEL=info
    depends_on:
      - kafka
      - redis
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  # ── Agent Workers ──
  agent-ddos:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=ddos
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  agent-anomaly:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=anomaly
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  agent-malware:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=malware
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  agent-phishing:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=phishing
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  agent-mitm:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=mitm
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  agent-ransomware:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.agent
    environment:
      - AGENT_TYPE=ransomware
    depends_on:
      - kafka
    volumes:
      - cdsi-models:/app/models
      - cdsi-datasets:/app/datasets
    restart: unless-stopped
    networks:
      - cdsi-net

  # ── Kafka ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - cdsi-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
    networks:
      - cdsi-net

  # ── Redis (caching) ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - cdsi-net

  # ── Prometheus ──
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cdsi-net

  # ── Grafana ──
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cdsi-admin
    depends_on:
      - prometheus
    networks:
      - cdsi-net

volumes:
  cdsi-models:
  cdsi-datasets:

networks:
  cdsi-net:
    driver: bridge
