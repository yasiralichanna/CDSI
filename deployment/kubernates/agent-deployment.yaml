apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdsi-agent-ddos
  labels:
    app: cdsi
    component: agent
    agent-type: ddos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdsi
      agent-type: ddos
  template:
    metadata:
      labels:
        app: cdsi
        component: agent
        agent-type: ddos
    spec:
      containers:
        - name: agent
          image: cdsi/agent:latest
          env:
            - name: AGENT_TYPE
              value: ddos
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
---
